{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <p class="eyebrow">TEACHER PANEL</p>

        <h1>Add Student</h1>

        <p>
            Create student profile and login account.
        </p>

    </div>

</div>


<div class="form-card">

<form method="POST">

    <h2>Student Information</h2>

    <div class="form-grid">

        <div class="form-group">

            <label>Student Roll Number</label>

            <input
                type="text"
                name="student_roll"
                placeholder="CSE006"
                required
            >

        </div>


        <div class="form-group">

            <label>Student Name</label>

            <input
                type="text"
                name="name"
                placeholder="Student name"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="student@email.com"
                required
            >

        </div>


        <div class="form-group">

            <label>Course</label>

            <input
                type="text"
                name="course"
                value="B.Tech CSE"
                required
            >

        </div>


        <div class="form-group">

            <label>Semester</label>

            <input
                type="number"
                name="semester"
                min="1"
                max="8"
                value="3"
                required
            >

        </div>


        <div class="form-group">

            <label>Division</label>

            <select name="division_id" required>

                <option value="">
                    Select Division
                </option>

                {% for division in divisions %}

                <option value="{{ division.id }}">
                    {{ division.division_name }}
                    - {{ division.course }}
                </option>

                {% endfor %}

            </select>

        </div>

    </div>


    <h2 class="form-section-title">
        Student Login
    </h2>


    <div class="form-grid">

        <div class="form-group">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="rahul01"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Student password"
                required
            >

        </div>

    </div>


    <div class="form-actions">

        <a
            href="{{ url_for('teacher_students') }}"
            class="secondary-btn">
            Cancel
        </a>

        <button
            type="submit"
            class="primary-btn">
            Create Student
        </button>

    </div>

</form>

</div>

{% endblock %}
